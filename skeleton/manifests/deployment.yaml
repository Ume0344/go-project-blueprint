apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.projectName }}
  labels:
    app: ${{ values.projectName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ values.projectName }}
  template:
    metadata:
      labels:
        app: ${{ values.projectName }}
    spec:
      containers:
        - name: ${{ values.projectName }}
          image: umehabiba04/backstage2go:${{ values.projectName }}
          ports:
            - containerPort: 8080